<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>钢铁突击 STEEL ASSAULT — 类魂斗罗横版射击</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23160b2e'/><rect x='3' y='6' width='10' height='4' fill='%23ffb830'/><rect x='11' y='7' width='4' height='2' fill='%2355516e'/></svg>">
  <link rel="stylesheet" href="style.css?v=0.2.0">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <p id="bootStatus" role="status" aria-live="polite">正在加载资源…</p>
    <button id="bootRetry" type="button" hidden>重试失败资源</button>
    <p id="hint">键盘操作：←→ 移动 · F 射击 · X/空格 跳跃 · ↑↓ 瞄准/蹲 · ENTER 开始/暂停 · M 静音 · O 设置（支持手柄）</p>
  </div>
  <div id="orientationHint" role="alert">请横屏游玩<br><small>旋转设备后将继续显示游戏</small></div>
  <script type="module" src="js/main.js?v=0.2.0"></script>
  <script>
    window.showBootError = (message) => {
      const status = document.getElementById('bootStatus');
      if (status) status.textContent = `启动失败：${message}。请刷新页面后重试。`;
    };
    window.addEventListener('error', (event) => {
      if (event.target?.tagName === 'SCRIPT') window.showBootError('游戏模块无法加载');
    }, true);
  </script>
</body>
</html>
