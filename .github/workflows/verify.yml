name: Verify
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix code run check
      - run: node code/tools/check-levels.mjs
      - run: node code/tools/report-levels.mjs
      - run: npm --prefix code install --no-save --no-package-lock playwright
      - run: npx --prefix code playwright install --with-deps chromium
      - run: python3 -m http.server 8787 --directory code >/tmp/steel-assault-http.log 2>&1 &
      - run: npm --prefix code run smoke
